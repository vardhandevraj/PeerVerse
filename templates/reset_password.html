<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | IVY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem("ivy-theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">
            <img class="brand-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="IVY">
        </a>

        <nav class="nav-links" id="navLinks">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>

        <div class="topbar-actions">
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
            <button class="menu-button" id="menuButton" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-panel login-panel">
            <div class="auth-intro">
                <div class="eyebrow">New Password</div>
                <h1>Choose a new password</h1>
                <p>
                    Pick a strong password for {{ email }}. Minimum 6 characters.
                </p>
            </div>

            <div class="auth-stack">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="flash-message">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}

                <form class="auth-form" action="{{ url_for('reset_password', token=token) }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="form-row">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                    </div>

                    <div class="form-row">
                        <label for="password2">Confirm New Password</label>
                        <input type="password" id="password2" name="confirm_password" placeholder="Repeat your new password" required>
                    </div>

                    <button class="submit-button" type="submit">Set Password</button>
                </form>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
