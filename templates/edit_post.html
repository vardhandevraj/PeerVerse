<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post | IVY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem("ivy-theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('feed') }}">
            <img class="brand-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="IVY">
        </a>

        <nav class="nav-links" id="navLinks">
            <a href="{{ url_for('feed') }}">Feed</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('students') }}">Students</a>
            <a href="{{ url_for('messages') }}">Messages</a>
            <a href="{{ url_for('notifications') }}">Notifications</a>
            <a href="{{ url_for('resources') }}">Resources</a>
            <a href="{{ url_for('search') }}">Search</a>
            <a href="{{ url_for('ai_assistant') }}">AI</a>
            <a href="{{ url_for('logout') }}">Sign Out</a>
        </nav>

        <div class="topbar-actions">
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
            <button class="menu-button" id="menuButton" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-panel login-panel">
            <div class="auth-intro">
                <div class="eyebrow">Modify Entry</div>
                <h1>Edit your post</h1>
                <p>Update or refine the content of your published discussion entry on IVY.</p>
            </div>

            <form class="auth-form" action="{{ url_for('edit_post', post_id=post.id) }}" method="POST">
                <div class="form-row">
                    <label for="content">Post Content</label>
                    <textarea id="content" name="content" rows="6" required>{{ post.content }}</textarea>
                </div>

                <div class="form-row">
                    <label for="post_type">Category</label>
                    <select id="post_type" name="post_type" required>
                        <option value="general" {% if post.post_type == "general" %}selected{% endif %}>General</option>
                        <option value="question" {% if post.post_type == "question" %}selected{% endif %}>Academic Question</option>
                        <option value="notes" {% if post.post_type == "notes" %}selected{% endif %}>Lecture Notes</option>
                        <option value="tip" {% if post.post_type == "tip" %}selected{% endif %}>Study Tip</option>
                    </select>
                </div>

                <button class="submit-button" type="submit">Save Changes</button>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
