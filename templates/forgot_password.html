<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | IVY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem("ivy-theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">
            <img class="brand-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="IVY">
        </a>

        <nav class="nav-links" id="navLinks">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>

        <div class="topbar-actions">
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
            <button class="menu-button" id="menuButton" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-panel login-panel">
            <div class="auth-intro">
                <div class="eyebrow">Account Recovery</div>
                <h1>Reset your password</h1>
                <p>
                    Enter your registered email and we'll send you a secure one-time reset link.
                </p>
            </div>

            <div class="auth-stack">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="flash-message">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}

                <form class="auth-form" action="{{ url_for('forgot_password') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="form-row">
                        <label for="email">Institutional Email</label>
                        <input type="email" id="email" name="email" placeholder="student@university.edu" required>
                    </div>

                    <button class="submit-button" type="submit">Send Reset Link</button>

                    <p class="form-note">
                        Remembered your password?
                        <a class="text-link" href="{{ url_for('login') }}">Sign in</a>.
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
